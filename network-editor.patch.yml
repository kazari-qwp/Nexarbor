# Optional local workbench. Configure workspace/storage before loading this patch.
# Use this instead of the default datanet-harness application entry for that workspace.
- insert:
    - id: nexarbor-network-editor
      name: datanet-harness/network-editor
      config:
        workspace: E:/DataNet-模块化成品/editor-workspace
        storage: E:/DataNet-模块化成品/editor-workspace/.datanet
        allowedAgentToolboxes: [world_resident]
        editor:
          enabled: true
