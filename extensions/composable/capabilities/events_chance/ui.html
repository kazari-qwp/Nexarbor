<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地点概率事件配置</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background: #141a20;
      color: #dce6ee;
      font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p.hint { margin: 0 0 12px; color: #93a4b4; }
    .event {
      border: 1px solid #2c3a47;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      background: #19222b;
    }
    .event-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .event-title { font-weight: 600; color: #cfe8ff; }
    label { display: block; margin-top: 8px; color: #aebdca; }
    input, textarea {
      width: 100%;
      margin-top: 3px;
      padding: 6px 8px;
      border: 1px solid #344655;
      border-radius: 6px;
      background: #0f151b;
      color: #e7f0f7;
      font: inherit;
    }
    textarea { min-height: 54px; resize: vertical; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row > label { flex: 1 1 130px; }
    .inline { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: #aebdca; }
    .inline input { width: auto; margin: 0; }
    button {
      border: 1px solid #3b566b;
      border-radius: 6px;
      padding: 6px 11px;
      background: #22313d;
      color: #dce6ee;
      font: inherit;
      cursor: pointer;
    }
    button.primary { background: #2b614f; border-color: #3f8a70; }
    button.danger { border-color: #754343; color: #ffc7c7; }
    button:disabled { opacity: .5; cursor: default; }
    #status { min-height: 20px; margin: 8px 0; color: #8fd6b5; white-space: pre-wrap; }
    #status.error { color: #ff9c9c; }
    .counts { margin-top: 14px; padding-top: 10px; border-top: 1px solid #2c3a47; color: #9fb2c2; }
    .empty { color: #8293a2; padding: 10px 0; }
  </style>
</head>
<body>
  <h1>地点概率事件配置</h1>
  <p class="hint">按顺序独立抽取；标识唯一。概率 0～1，次数上限留空表示不限。</p>
  <div id="events"></div>
  <div class="row" style="margin-bottom:8px">
    <button id="add" type="button">添加事件</button>
    <button id="save" class="primary" type="button">保存配置</button>
  </div>
  <div id="status" role="status"></div>
  <div class="counts" id="counts"></div>

  <script>
    const host = window.NexarborModule;
    let current = null;
    let draft = [];
    let readOnly = false;

    const eventsBox = document.getElementById('events');
    const statusBox = document.getElementById('status');
    const countsBox = document.getElementById('counts');
    const addButton = document.getElementById('add');
    const saveButton = document.getElementById('save');

    function setStatus(message, isError) {
      statusBox.textContent = message || '';
      statusBox.className = isError ? 'error' : '';
    }

    function normalizeEvent(raw) {
      const event = raw && typeof raw === 'object' ? raw : {};
      return {
        id: typeof event.id === 'string' ? event.id : '',
        text: typeof event.text === 'string' ? event.text : '',
        probability: typeof event.probability === 'number' ? event.probability : 0,
        limit: Number.isInteger(event.limit) && event.limit > 0 ? event.limit : null,
        rewards: event.rewards && typeof event.rewards === 'object' && !Array.isArray(event.rewards)
          ? { ...event.rewards }
          : {}
      };
    }

    function field(labelText, value, onInput, type) {
      const label = document.createElement('label');
      label.textContent = labelText;
      const input = document.createElement('input');
      input.type = type || 'text';
      input.value = value;
      input.disabled = readOnly;
      input.addEventListener('input', onInput);
      label.appendChild(input);
      return label;
    }

    function render() {
      eventsBox.replaceChildren();
      if (!draft.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '还没有事件，点击“添加事件”开始配置。';
        eventsBox.appendChild(empty);
      }

      draft.forEach((event, index) => {
        const card = document.createElement('section');
        card.className = 'event';

        const head = document.createElement('div');
        head.className = 'event-head';
        const title = document.createElement('span');
        title.className = 'event-title';
        title.textContent = '事件 ' + (index + 1) + (event.id ? '：' + event.id : '');
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'danger';
        remove.textContent = '删除';
        remove.disabled = readOnly;
        remove.addEventListener('click', () => {
          draft.splice(index, 1);
          render();
        });
        head.append(title, remove);
        card.appendChild(head);

        card.appendChild(field('事件标识', event.id, e => { event.id = e.target.value; }, 'text'));

        const textLabel = document.createElement('label');
        textLabel.textContent = '事件文字';
        const textArea = document.createElement('textarea');
        textArea.value = event.text;
        textArea.disabled = readOnly;
        textArea.addEventListener('input', e => { event.text = e.target.value; });
        textLabel.appendChild(textArea);
        card.appendChild(textLabel);

        const row = document.createElement('div');
        row.className = 'row';
        row.appendChild(field('触发概率（0～1）', event.probability, e => {
          const value = Number(e.target.value);
          event.probability = Number.isFinite(value) ? value : 0;
        }, 'number'));
        row.appendChild(field('成功次数上限（留空不限）', event.limit === null ? '' : event.limit, e => {
          const value = e.target.value.trim();
          if (!value) {
            event.limit = null;
            return;
          }
          const parsed = Number(value);
          event.limit = Number.isInteger(parsed) && parsed > 0 ? parsed : null;
        }, 'number'));
        card.appendChild(row);

        const rewardLabel = document.createElement('label');
        rewardLabel.textContent = '奖励（JSON 数字映射，例如 {"金币": 3}）';
        const rewardArea = document.createElement('textarea');
        rewardArea.value = JSON.stringify(event.rewards);
        rewardArea.disabled = readOnly;
        rewardArea.addEventListener('input', e => {
          try {
            const parsed = JSON.parse(e.target.value || '{}');
            event.rewards = parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
          } catch (error) {
            // 保留输入，保存时再提示具体错误。
          }
        });
        rewardLabel.appendChild(rewardArea);
        card.appendChild(rewardLabel);

        eventsBox.appendChild(card);
      });

      addButton.disabled = readOnly;
      saveButton.disabled = readOnly;
      renderCounts();
    }

    function renderCounts() {
      const state = current && current.state ? current.state : {};
      const counts = state.counts && typeof state.counts === 'object' ? state.counts : {};
      countsBox.replaceChildren();
      const title = document.createElement('div');
      title.textContent = '当前累计成功次数';
      countsBox.appendChild(title);
      const entries = Object.entries(counts);
      if (!entries.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '尚无成功事件。';
        countsBox.appendChild(empty);
        return;
      }
      entries.forEach(([key, value]) => {
        const line = document.createElement('div');
        line.textContent = key + '：' + value + ' 次';
        countsBox.appendChild(line);
      });
    }

    function collectConfig() {
      const seen = new Set();
      const events = draft.map((event, index) => {
        const id = event.id.trim();
        const text = event.text.trim();
        if (!id) throw new Error('事件 ' + (index + 1) + ' 缺少事件标识');
        if (seen.has(id)) throw new Error('事件标识重复：' + id);
        seen.add(id);
        if (!text) throw new Error('事件 ' + id + ' 缺少事件文字');
        const probability = Number(event.probability);
        if (!Number.isFinite(probability) || probability < 0 || probability > 1) {
          throw new Error('事件 ' + id + ' 的触发概率必须在 0 到 1 之间');
        }
        let limit = event.limit;
        if (limit === '' || limit === undefined) limit = null;
        if (limit !== null && (!Number.isInteger(limit) || limit < 1)) {
          throw new Error('事件 ' + id + ' 的成功次数上限必须是正整数或留空');
        }
        const rewards = event.rewards;
        if (!rewards || typeof rewards !== 'object' || Array.isArray(rewards)) {
          throw new Error('事件 ' + id + ' 的奖励必须是 JSON 数字映射');
        }
        for (const [key, value] of Object.entries(rewards)) {
          if (!key || typeof value !== 'number' || !Number.isFinite(value) || value < 0) {
            throw new Error('事件 ' + id + ' 的奖励字段和数值必须是非负数字映射');
          }
        }
        return { id, text, probability, limit, rewards: { ...rewards } };
      });
      return { ...(current && current.config ? current.config : {}), events };
    }

    addButton.addEventListener('click', () => {
      draft.push({ id: '', text: '', probability: 0, limit: null, rewards: {} });
      render();
    });

    saveButton.addEventListener('click', async () => {
      if (!current || readOnly) return;
      try {
        const next = collectConfig();
        await host.setConfig(next);
        setStatus('已写入网络草稿，应用网络后生效。', false);
      } catch (error) {
        setStatus(error && error.message ? error.message : String(error), true);
      }
    });

    host.onContext(context => {
      current = context;
      readOnly = Boolean(context.readOnly);
      draft = Array.isArray(context.config && context.config.events)
        ? context.config.events.map(normalizeEvent)
        : [];
      render();
      if (readOnly) setStatus('当前为只读预览，不能修改配置。', false);
    });
  </script>
</body>
</html>
