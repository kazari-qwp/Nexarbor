<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>
:root{color-scheme:dark;font:13px system-ui;color:#dce9f3;background:#14212b}body{margin:12px}h3{font-size:14px}p{color:#a9c3d3;line-height:1.6}button,input,select,textarea{font:inherit;color:inherit;background:#213847;border:1px solid #4a6a7b;border-radius:5px;padding:6px}button{cursor:pointer}button:hover{background:#31566a}textarea{width:calc(100% - 16px);min-height:70px}section{border:1px solid #375161;border-radius:6px;margin:10px 0;padding:9px}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}input{min-width:70px;max-width:42%}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.error{color:#ffaaaa}.muted{color:#93b2c4}summary{cursor:pointer}small{color:#a9c3d3}
</style><h3>上下文组装器</h3><p>角色只连接本节点的 <b>context.assemble</b> 频道。下游文本分别用 <b>system_prompt</b>（系统指令）、<b>context</b>（长效资料）、<b>inputs</b>（一次性输入）、<b>tail</b>（每次请求的最新快照）连接。只沿同一种频道遍历。</p>
<h3>直接文本 / 文本路径</h3><div id="sources"></div><button id="add">＋ 添加来源</button> <button id="save">保存配置</button> <button id="preview">◉ 装配预览</button><p id="status"></p><div id="result"></div>
<script>
const host=window.NexarborModule,$=id=>document.getElementById(id),kinds=['system_prompt','context','inputs','tail'];let current,config,dirty=false;
const el=(name,text)=>{let n=document.createElement(name);if(text!==undefined)n.textContent=text;return n};
function field(value,change,type='input'){const n=el(type);n.value=value??'';n.oninput=()=>{dirty=true;change(n.value)};return n}
function select(values,value,change){let n=el('select');values.forEach(v=>{let o=el('option',v);o.value=v;n.append(o)});n.value=value;n.onchange=()=>{dirty=true;change(n.value);draw()};return n}
function draw(){ $('sources').replaceChildren();(config.sources??[]).forEach((s,i)=>{let box=el('section'),row=el('div');row.className='row';row.append(field(s.id,v=>s.id=v),select(kinds,s.kind,v=>s.kind=v),select(['text','file'],s.type,v=>s.type=v));let del=el('button','🗑 删除');del.onclick=()=>{config.sources.splice(i,1);dirty=true;draw()};row.append(del);box.append(row);if(s.type==='file'){box.append(el('p','路径相对当前项目目录；完整解析位置见预览。'),field(s.path,v=>s.path=v))}else box.append(field(s.text,v=>s.text=v,'textarea'));if(s.kind==='inputs'){box.append(el('small',' 一次性事件编号：'),field(s.event_id,v=>s.event_id=v))}box.append(el('small',' 顺序：'),field(s.order??0,v=>s.order=Number(v)));if(s.when&&Object.keys(s.when).length)box.append(el('pre','条件：'+JSON.stringify(s.when)));$('sources').append(box)});$('save').disabled=current?.readOnly??true;host.resize(Math.min(900,document.body.scrollHeight+30))}
host.onContext(c=>{current=c;if(!dirty){config=structuredClone(c.config);config.sources??=[];draw()}});
$('add').onclick=()=>{config.sources.push({id:crypto.randomUUID(),kind:'context',type:'text',text:''});dirty=true;draw()};
$('save').onclick=async()=>{try{await host.setConfig(config);dirty=false;$('status').textContent='已写入网络草稿。校验并更新网络后生效。'}catch(e){$('status').textContent=e.message}};
$('preview').onclick=async()=>{try{if(dirty){await host.setConfig(config);dirty=false} $('status').textContent='读取当前接线与文本…';let result=await host.preview();$('result').replaceChildren();for(const kind of kinds){let d=el('details'),summary=el('summary',kind);d.open=true;d.append(summary,el('pre',typeof result.patch[kind]==='string'?result.patch[kind]:JSON.stringify(result.patch[kind],null,2)));$('result').append(d)}for(const s of result.sources){let p=el('pre',(s.matched?'✓ ':'○ ')+s.kind+' ← '+(s.resolved_path??s.source)+'\n'+(s.channel?'频道：'+s.channel+'；路径：'+s.path.join(' → '):'直接配置')+'\n'+(s.matched?'已匹配':'未匹配 / 已禁用'));$('result').append(p)}for(const e of result.errors){let p=el('p',e.source+'：'+e.error);p.className='error';$('result').append(p)}$('status').textContent='只读预览：不会消费 inputs，也不会更改对话。';host.resize(900)}catch(e){$('status').textContent=e.message}};
</script></html>
