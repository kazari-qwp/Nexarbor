<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>滑动窗口数值统计配置</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #17201f;
      --panel: #202c2a;
      --border: #3b4b48;
      --text: #e8f1ef;
      --muted: #9fb2ae;
      --accent: #79d2b6;
      --danger: #ff9a9a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 240px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { padding: 14px; max-width: 560px; }
    h1 { margin: 0 0 4px; font-size: 17px; font-weight: 650; }
    p.hint { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px;
      margin-bottom: 12px;
    }
    label { display: block; font-weight: 600; margin-bottom: 5px; }
    input[type="number"] {
      width: 100%;
      padding: 8px 9px;
      color: var(--text);
      background: #141c1b;
      border: 1px solid var(--border);
      border-radius: 7px;
      font: inherit;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .field-hint { margin: 6px 0 10px; color: var(--muted); font-size: 12px; }
    button {
      padding: 8px 14px;
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: #10201c;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: default; }
    #status { min-height: 1.5em; margin: 8px 0 0; font-size: 12px; color: var(--muted); }
    #status.error { color: var(--danger); }
    h2 { margin: 0 0 8px; font-size: 14px; }
    dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
    code { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>滑动窗口数值统计</h1>
    <p class="hint">配置只影响本节点；修改后先写入网络草稿，应用网络后生效。</p>

    <section class="card">
      <label for="window-size">窗口容量</label>
      <input id="window-size" type="number" min="1" max="1000" step="1" inputmode="numeric">
      <p class="field-hint">只保留最近 1～1000 个数值，默认 3。超出容量的最早数值会自动丢弃。</p>
      <button id="save" type="button">保存配置</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2>当前窗口（只读）</h2>
      <dl>
        <dt>数值个数</dt><dd id="stat-count">—</dd>
        <dt>最小值</dt><dd id="stat-min">—</dd>
        <dt>最大值</dt><dd id="stat-max">—</dd>
        <dt>算术平均值</dt><dd id="stat-mean">—</dd>
        <dt>窗口容量</dt><dd id="stat-size">—</dd>
        <dt>窗口数值</dt><dd><code id="stat-values">—</code></dd>
      </dl>
    </section>
  </main>

  <script>
    (function () {
      "use strict";
      var host = window.NexarborModule;
      var input = document.getElementById("window-size");
      var saveButton = document.getElementById("save");
      var status = document.getElementById("status");
      var current = null;
      var dirty = false;

      function setStatus(text, isError) {
        status.textContent = text || "";
        status.className = isError ? "error" : "";
      }

      function display(value) {
        return value === null || value === undefined ? "无（窗口为空）" : String(value);
      }

      function renderState(state) {
        var data = state || {};
        var values = Array.isArray(data.window) ? data.window : [];
        var count = values.length;
        var min = null;
        var max = null;
        var mean = null;
        if (count > 0) {
          min = Math.min.apply(null, values);
          max = Math.max.apply(null, values);
          var total = values.reduce(function (sum, item) { return sum + item; }, 0);
          mean = total / count;
        }
        document.getElementById("stat-count").textContent = String(count);
        document.getElementById("stat-min").textContent = display(min);
        document.getElementById("stat-max").textContent = display(max);
        document.getElementById("stat-mean").textContent = display(mean);
        document.getElementById("stat-size").textContent = display(data.window_size != null ? data.window_size : (current && current.config ? current.config.window_size : null));
        document.getElementById("stat-values").textContent = count > 0 ? values.join("，") : "—";
      }

      function render(context) {
        current = context;
        var size = context && context.config ? context.config.window_size : 3;
        if (!dirty && document.activeElement !== input) {
          input.value = size == null ? "3" : String(size);
        }
        var readOnly = Boolean(context && context.readOnly);
        input.disabled = readOnly;
        saveButton.disabled = readOnly;
        renderState(context && context.state);
      }

      if (!host || typeof host.onContext !== "function") {
        setStatus("配置界面未连接到宿主，无法读取或保存。", true);
        input.disabled = true;
        saveButton.disabled = true;
        return;
      }

      input.addEventListener("input", function () {
        dirty = true;
        setStatus("");
      });

      saveButton.addEventListener("click", async function () {
        if (!current) {
          setStatus("尚未读取到当前配置，请稍后重试。", true);
          return;
        }
        var text = input.value.trim();
        var size = Number(text);
        if (!/^\d+$/.test(text) || !Number.isInteger(size) || size < 1 || size > 1000) {
          setStatus("窗口容量必须是 1 到 1000 之间的整数。", true);
          return;
        }
        var next = Object.assign({}, current.config || {}, { window_size: size });
        saveButton.disabled = true;
        setStatus("正在保存…");
        try {
          await host.setConfig(next);
          dirty = false;
          setStatus("已写入网络草稿，应用网络后生效。");
        } catch (error) {
          setStatus(error && error.message ? error.message : "保存失败，请检查输入后重试。", true);
        } finally {
          saveButton.disabled = Boolean(current && current.readOnly);
        }
      });

      host.onContext(render);
    })();
  </script>
</body>
</html>
