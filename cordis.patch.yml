        maxSignalStrength: 100
        rootToolboxes: [node_operations, network_management_skill, official_tools, official_skills, topology_inspection, self_repair]
        allowedAgentToolboxes: [network_access, node_operations, network_management_skill, engineering, official_tools, official_readonly, official_skills, discussion_member, topology_inspection, self_repair]
